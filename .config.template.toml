# ==============================================================================
# JM Brain Vault 开源公开配置模板 (Open-Source Config Template)
# 使用方法：复制本文件为 `.config.toml`，并根据个人实际情况修改配置
# 任何可在 Skill 内部定制的行为均在此处声明
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 知识库路径与全局扫描黑名单配置
# ------------------------------------------------------------------------------
[vault]
root = "~/Documents/Brain_Vault"      # Obsidian 本地仓库根目录
vault_name = "Brain_Vault"            # Obsidian 软件中注册的 Vault 仓库名称 (用于生成 obsidian://open 深度链接)
inbox_folder = "00_Inbox"             # 缓冲收件箱目录
archive_folder = "99_Archive"         # 历史备查归档目录
ignore_patterns = [                   # 全局巡检、搜索与织网排除目录/文件模式
    ".obsidian",
    ".trash",
    ".git",
    "node_modules",
    "__pycache__",
    "newdao-ide-windows",
    "jdk"
]
valid_extensions = [".md", ".canvas", ".base"]

# ------------------------------------------------------------------------------
# 2. SQLite 高性能持久化存储引擎配置
# ------------------------------------------------------------------------------
[database]
db_path = ".vault_index.db"           # 数据库相对路径（基于 skill 根目录）或绝对路径
mmap_size_mb = 256                    # 操作系统内存直接映射 (mmap) 空间大小 (MB)
cache_size_kb = 64000                 # SQLite 快速查询内存页面缓存大小 (KB)
min_trigram_len = 3                   # FTS5 Trigram 分词最小检索字符阈值

# ------------------------------------------------------------------------------
# 3. 知识库所有者画像与主权信息
# ------------------------------------------------------------------------------
[user_profile]
owner_name = "知识库主人"
brain_title = "商业数字大脑"

# ------------------------------------------------------------------------------
# 4. 商业交付导出排版配置 (Word & HTML)
# ------------------------------------------------------------------------------
[export_settings]
docx_header = "商业数字大脑交付案卷"
default_author = "知识库主人"
export_dir = "Exports"                # 导出成果存储子目录 (支持相对知识库根目录或自定义路径)

# ------------------------------------------------------------------------------
# 5. Faster-Whisper 本地离线语音听写配置
# ------------------------------------------------------------------------------
[transcribe]
model_size = "base"                   # Whisper 模型规格: tiny | base | small | medium | large-v3
language = "zh"                       # 听写语言: zh (中文) | en (英文)
output_dir = "Voice_Notes"            # 语音速记与整理笔记归档目录
default_domain = "资产/录音速记"       # 录音整理默认业务领域

# ------------------------------------------------------------------------------
# 6. 网页智能提纯与剪藏归档配置
# ------------------------------------------------------------------------------
[web_clip]
output_dir = "Web_Clips"              # 网页剪藏笔记归档目录

# ------------------------------------------------------------------------------
# 7. 月度生长与里程碑简报配置
# ------------------------------------------------------------------------------
[digest]
output_dir = "Digests"                # 生长与里程碑简报归档目录

# ------------------------------------------------------------------------------
# 8. 30天动态代谢生命周期时间窗配置 (天)
# ------------------------------------------------------------------------------
[metabolism]
hot_days = 7                          # 🔥 超高频攻坚时间窗 (最近 N 天内有更新)
active_days = 30                      # ⚡ 持续推进时间窗 (N 天内有更新)
dormant_days = 60                     # ❄️ 休眠淘汰阈值 (超过 N 天无更新降级折叠)

# ------------------------------------------------------------------------------
# 9. 智能模糊检索同义词与意图展开（示例）
# ------------------------------------------------------------------------------
[search_synonyms]
"零售" = ["即时零售", "传统门店数字化", "全渠道"]
"战略" = ["商业定位", "增长模型", "方法论"]
"财务" = ["家庭压力测试", "投资账本", "资产盘点"]

# ------------------------------------------------------------------------------
# 10. 实体高价值双向链接自动编织映射表（示例）
# ------------------------------------------------------------------------------
[entity_auto_links]
"商业定位" = "[[商业战略/定位方法论.md|商业定位]]"
"即时零售" = "[[行业研究/即时零售研究.md|即时零售]]"
