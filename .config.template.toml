# ==============================================================================
# JM Brain Vault 开源公开配置模板 (Open-Source Config Template)
# 使用方法：复制本文件为 `.config.toml`，并根据个人实际情况修改配置
# ==============================================================================

[vault]
root = "~/Documents/Brain_Vault"
inbox_folder = "00_Inbox"
archive_folder = "99_Archive"

[user_profile]
owner_name = "知识库主人"
brain_title = "商业数字大脑"

[export_settings]
docx_header = "商业数字大脑交付案卷"
default_author = "知识库主人"

# ------------------------------------------------------------------------------
# 智能模糊检索同义词与意图展开（示例）
# ------------------------------------------------------------------------------
[search_synonyms]
"零售" = ["即时零售", "传统门店数字化", "全渠道"]
"战略" = ["商业定位", "增长模型", "方法论"]
"财务" = ["家庭压力测试", "投资账本", "资产盘点"]

# ------------------------------------------------------------------------------
# 实体高价值双向链接自动编织映射表（示例）
# ------------------------------------------------------------------------------
[entity_auto_links]
"商业定位" = "[[02_Enterprise_AI/Business_Strategy/定位方法论.md|商业定位]]"
